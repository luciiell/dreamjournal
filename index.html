<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Welcome to the Dreamlands Respiratory.">
  <title>Welcome to the Dreamlands Respiratory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <p class="eyebrow">Fall into the slumber of the Dreamland</p>
      <h1>Welcome to the Dreamlands Respiratory</h1>
      <p class="intro">Choose a volume from the shelf and wander wherever it opens.</p>
    </header>

    <main>
      <section class="library" aria-labelledby="library-title">
        <div class="section-heading">
          <span class="section-rule"></span>
          <h2 id="library-title">The Library</h2>
          <span class="section-rule"></span>
        </div>

        <div class="bookshelf" aria-label="Dreamlands books">
          <div class="shelf-top"></div>
          <div class="books">
            <button class="book book-1" data-book="about" type="button" aria-label="Open About the Dreamlands"><span class="book-spine-title">About the Dreamlands</span><span class="book-number">I</span></button>
            <button class="book book-2" data-book="waypoints" type="button" aria-label="Open Dreamland Waypoints"><span class="book-spine-title">Dreamland Waypoints</span><span class="book-number">II</span></button>
            <button class="book book-3" data-book="worlds" type="button" aria-label="Open Dreamland Worlds"><span class="book-spine-title">Dreamland Worlds</span><span class="book-number">III</span></button>
            <button class="book book-4" data-book="residents" type="button" aria-label="Open Dreamland Residents"><span class="book-spine-title">Dreamland Residents</span><span class="book-number">IV</span></button>
            <button class="book book-5" data-book="archives" type="button" aria-label="Open Dreamland Archives"><span class="book-spine-title">Dreamland Archives</span><span class="book-number">V</span></button>
          </div>
          <div class="shelf-front"></div>
          <div class="shelf-shadow"></div>
        </div>
        <p class="library-hint">Hover over a book to pull it from the shelf · Click to open</p>
      </section>

      <section class="reader" id="reader" aria-hidden="true">
        <div class="reader-backdrop"></div>
        <button class="page-arrow page-arrow-prev" id="prev-page" type="button" aria-label="Previous page">←</button>

        <div class="open-book" role="dialog" aria-modal="true" aria-labelledby="book-title">
          <article class="book-page left-page" id="left-page">
            <div class="page-inner" id="left-inner"></div>
          </article>
          <article class="book-page right-page" id="right-page">
            <div class="page-inner" id="right-inner"></div>
          </article>
        </div>

        <button class="page-arrow page-arrow-next" id="next-page" type="button" aria-label="Next page">→</button>
        <div class="reader-controls">
          <span class="page-status" id="page-status" aria-live="polite">Page 1 of 1</span>
          <button class="put-away" id="put-away" type="button">Put this book away</button>
          <span class="keyboard-hint">← → to turn pages · Esc to close</span>
        </div>
      </section>
    </main>

    <footer class="site-footer"><span>✦</span><span>Sleep to dream, wake up to leave.</span><span>✦</span></footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
